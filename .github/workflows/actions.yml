name: CI/CD

on:
  push:
    branches: [ main, master, research ]
  pull_request:
    branches: [ main, master, research ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
      - name: Run tests
        run: |
          python -m pytest -q --maxfail=1 --disable-warnings

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Docker Hub login and push (if DOCKERHUB credentials provided)
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/churn-api:latest

      # AWS ECR login and push (if AWS credentials provided)
      - name: Configure AWS credentials for ECR
        if: ${{ secrets.AWS_ACCOUNT_ID != '' && secrets.AWS_REGION != '' && secrets.ECR_REPOSITORY != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ secrets.AWS_ACCOUNT_ID != '' && secrets.AWS_REGION != '' && secrets.ECR_REPOSITORY != '' }}
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push to ECR
        if: ${{ secrets.AWS_ACCOUNT_ID != '' && secrets.AWS_REGION != '' && secrets.ECR_REPOSITORY != '' }}
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
      - name: Set image output
        id: set-image
        run: |
          # Determine which registry/image was pushed and set the job output accordingly.
          if [ "${{ secrets.DOCKERHUB_USERNAME }}" != "" ]; then
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/churn-api:latest" >> $GITHUB_OUTPUT
          elif [ "${{ secrets.AWS_ACCOUNT_ID }}" != "" ] && [ "${{ secrets.AWS_REGION }}" != "" ] && [ "${{ secrets.ECR_REPOSITORY }}" != "" ]; then
            echo "image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT
          else
            echo "image=churn-api:latest" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE=${{ needs.build_and_push.outputs.image }}
            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"
            docker stop churn-api || true
            docker rm churn-api || true
            docker run -d --name churn-api -p 8000:8000 --env-file /home/${{ secrets.EC2_USER }}/.env -v /home/${{ secrets.EC2_USER }}/mlruns:/app/mlruns "$IMAGE"
